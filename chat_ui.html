<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rareprint Bot — Test Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .phone-wrap { width: 380px; height: 720px; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }

  .header { background: #075e54; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .header-info .name { font-weight: 600; font-size: 15px; }
  .header-info .status { font-size: 12px; color: #a8d5af; }
  .reset-btn { margin-left: auto; background: none; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 12px; }
  .reset-btn:hover { background: rgba(255,255,255,0.15); }

  .messages { flex: 1; overflow-y: auto; padding: 12px; background: #e5ddd5; display: flex; flex-direction: column; gap: 6px; }

  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.45; word-break: break-word; position: relative; }
  .bubble .time { font-size: 10px; color: #999; text-align: right; margin-top: 3px; }

  .bot { background: #fff; border-top-left-radius: 0; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .user { background: #dcf8c6; border-top-right-radius: 0; align-self: flex-end; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

  .media-bubble { max-width: 78%; align-self: flex-start; }
  .media-bubble img { width: 100%; border-radius: 8px; border-top-left-radius: 0; }
  .media-bubble video { width: 100%; border-radius: 8px; border-top-left-radius: 0; }
  .media-caption { background: #fff; padding: 6px 10px; font-size: 12px; color: #333; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; white-space: pre-wrap; }

  .typing { align-self: flex-start; background: #fff; border-radius: 8px; border-top-left-radius: 0; padding: 10px 14px; display: none; }
  .typing span { display: inline-block; width: 7px; height: 7px; background: #aaa; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  .input-row { display: flex; align-items: center; padding: 8px 10px; background: #f0f0f0; gap: 8px; border-top: 1px solid #ddd; }
  #msg-input { flex: 1; border: none; background: #fff; border-radius: 20px; padding: 10px 14px; font-size: 14px; outline: none; resize: none; max-height: 100px; font-family: inherit; }
  .send-btn { width: 42px; height: 42px; background: #075e54; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
  .send-btn:hover { background: #128c7e; }
  .send-btn svg { fill: white; width: 20px; height: 20px; }

  .product-card { max-width: 78%; align-self: flex-start; background: #fff; border-radius: 8px; border-top-left-radius: 0; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .product-card img, .product-card video { width: 100%; max-height: 180px; object-fit: cover; }
  .product-card .caption { padding: 8px 10px; font-size: 12px; white-space: pre-wrap; color: #333; }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="header">
    <div class="avatar">🖨️</div>
    <div class="header-info">
      <div class="name">Rareprint Bot</div>
      <div class="status" id="status-text">online</div>
    </div>
    <button class="reset-btn" onclick="resetChat()">New Chat</button>
  </div>

  <div class="messages" id="messages">
    <!-- messages appear here -->
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-row">
    <textarea id="msg-input" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────
  const API_BASE = window.location.origin;   // same server
  const TEST_PHONE = "919000000001";          // fake phone for testing
  const TEST_NAME  = "Test User";

  let sessionId = "test_" + Date.now();

  // ── Send message ────────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    autoResize(input);
    appendBubble("user", text);
    showTyping(true);
    updateStatus("typing...");

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: TEST_PHONE, name: TEST_NAME, text, session_id: sessionId })
      });
      const data = await res.json();

      showTyping(false);
      updateStatus("online");

      // Render each message from bot
      for (const msg of data.messages || []) {
        await delay(400);
        renderBotMessage(msg);
      }
    } catch (e) {
      showTyping(false);
      updateStatus("online");
      appendBubble("bot", "❌ Could not reach server. Is it running?");
    }
  }

  function renderBotMessage(msg) {
    const container = document.getElementById("messages");

    if (msg.type === "text") {
      appendBubble("bot", msg.content);

    } else if (msg.type === "image") {
      const wrap = document.createElement("div");
      wrap.className = "product-card";
      wrap.innerHTML = `
        <img src="${msg.url}"
          style="width:100%;border-radius:8px 8px 0 0;max-height:180px;object-fit:cover;"
          onerror="this.outerHTML='<a href=\\'${msg.url}\\' target=\\'_blank\\' style=\\'display:block;padding:10px;background:#f0f0f0;text-align:center;font-size:12px;color:#075e54;\\'>📷 View Product Image</a>'"
          alt="product"/>
        ${msg.caption ? `<div class="caption">${formatText(msg.caption)}</div>` : ""}
      `;
      container.appendChild(wrap);

    } else if (msg.type === "video") {
      const wrap = document.createElement("div");
      wrap.className = "product-card";
      wrap.innerHTML = `
        <video src="${msg.url}" controls playsinline
          style="width:100%;border-radius:8px 8px 0 0;max-height:180px;"
          onerror="this.outerHTML='<a href=\\'${msg.url}\\' target=\\'_blank\\' style=\\'display:block;padding:10px;background:#f0f0f0;text-align:center;font-size:12px;color:#075e54;\\'>🎬 View Product Video</a>'">
        </video>
        ${msg.caption ? `<div class="caption">${formatText(msg.caption)}</div>` : ""}
      `;
      container.appendChild(wrap);

    } else if (msg.type === "document") {
      const label = msg.filename || "View document";
      appendBubble("bot", `${msg.caption ? msg.caption + "\n" : ""}${label}: ${msg.url}`);
    }

    scrollBottom();
  }

  function appendBubble(role, text) {
    const container = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = `<div>${formatText(text)}</div><div class="time">${now}</div>`;
    container.appendChild(div);
    scrollBottom();
  }

  function formatText(t) {
    return t
      .replace(/\*(.*?)\*/g, "<b>$1</b>")
      .replace(/_(.*?)_/g, "<i>$1</i>")
      .replace(/\n/g, "<br>");
  }

  function resetChat() {
    sessionId = "test_" + Date.now();
    document.getElementById("messages").innerHTML = "";
    appendBubble("bot", "👋 New chat started! Ask me about any Rareprint product.");
  }

  function showTyping(show) {
    document.getElementById("typing").style.display = show ? "block" : "none";
    scrollBottom();
  }

  function updateStatus(s) { document.getElementById("status-text").textContent = s; }
  function scrollBottom() { const m = document.getElementById("messages"); m.scrollTop = m.scrollHeight; }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
  function handleKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
  function autoResize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 100) + "px"; }

  // Initial greeting
  appendBubble("bot", "👋 Hello! Welcome to *Rareprint*.\nWhat would you like to print today? 😊");
</script>
</body>
</html>
