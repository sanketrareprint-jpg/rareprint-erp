// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Required to compile the Kotlin plugin files (MainActivity.kt,
        // CallManagerPlugin.kt, OverlayService.kt) — without this, Gradle
        // silently skips .kt sources instead of erroring, and the app
        // crashes at launch with ClassNotFoundException for MainActivity.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
