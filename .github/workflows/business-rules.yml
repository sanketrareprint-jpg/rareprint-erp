name: Business Rule Guard

# Runs on every push and pull request to main.
# If any business rule test fails, the push is blocked.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  business-rules:
    name: Verify Business Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run business rule tests
        working-directory: backend
        run: |
          npx jest \
            --testPathPatterns="business-rules.spec.ts" \
            --passWithNoTests=false \
            --forceExit \
            --verbose
        env:
          NODE_ENV: test
          # Business rule tests use pure logic — no DB needed
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/coverage/
